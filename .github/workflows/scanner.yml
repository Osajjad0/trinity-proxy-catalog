name: refresh-verified

on:
  schedule:
    - cron: '4 11 * * *'  # 11:04 UTC daily — same time as the first manual scan
  workflow_dispatch:

permissions:
  contents: write   # the scan publishes verified results to the repo

concurrency:
  group: verified-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scanner (country-fair, every source country daily)
        run: |
          python scanner/scan.py --per-country --publish --state scanner/state.json

      - name: Validate verified feed
        run: |
          python - <<'EOF'
          import json, pathlib
          out = pathlib.Path('catalog/verified')
          feed = json.loads((out / 'feed.json').read_text())
          assert feed['schema_version'] == 1
          assert all(len(cc) == 2 and cc.isupper() for cc in feed['countries'])
          total = sum(len(v) for v in feed['countries'].values())
          assert feed['counts']['verified'] == total, 'feed count mismatch'
          for cc, entries in feed['countries'].items():
              for addr, port in entries:
                  assert isinstance(port, int) and 0 < port < 65536
          print('validated:', total, 'verified across', len(feed['countries']), 'countries')
          EOF

      - name: Trinity sync (drive the TEST panel's operator API)
        env:
          TRINITY_PANEL_URL: ${{ secrets.TRINITY_PANEL_URL }}
          TRINITY_PANEL_PASSWORD: ${{ secrets.TRINITY_PANEL_PASSWORD }}
        run: |
          python - <<'EOF'
          # V24.6.1 §13 idempotency + Phase 9 post-verification.
          import json, os, urllib.request
          base = (os.environ.get("TRINITY_PANEL_URL") or "").rstrip("/")
          pw = os.environ.get("TRINITY_PANEL_PASSWORD") or ""
          if not base or not pw:
              print("trinity sync SKIPPED: TRINITY_PANEL_URL / TRINITY_PANEL_PASSWORD secrets not configured")
              print("one-time setup: gh secret set TRINITY_PANEL_URL ; gh secret set TRINITY_PANEL_PASSWORD")
              raise SystemExit(0)  # secrets absent: leave pipeline safe, fail only in operator onboarding
          new_rev = json.load(open("catalog/verified/feed.json"))["content_revision"]
          def meta():
              try:
                  return json.load(urllib.request.urlopen(base + "/api/catalog-meta", timeout=30))
              except Exception:
                  return {}  # first sync or meta endpoint absent — proceed
          old_meta = meta()
          if old_meta.get("contentRevision") == new_rev:
              print("trinity sync skipped: feed unchanged (", new_rev[:12], ")")
              raise SystemExit(0)
          login = urllib.request.Request(base + "/api/login",
              data=json.dumps({"password": pw}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          resp = urllib.request.urlopen(login, timeout=30)
          cookie = resp.headers.get("Set-Cookie", "").split(";")[0]
          req = urllib.request.Request(base + "/api/catalog-sync",
              data=b"{}", headers={"Cookie": cookie,
              "Content-Type": "application/json"}, method="POST")
          report = json.loads(urllib.request.urlopen(req, timeout=120).read())
          print("trinity sync ok:", report.get("ok"),
                "| countries:", report.get("countryCount"),
                "| endpoints:", report.get("endpointCount"))
          if not report.get("ok"):
              raise SystemExit(1)
          # Post-sync verification: Trinity revision must equal GitHub feed revision.
          after = meta()
          if after.get("contentRevision") != new_rev:
              raise SystemExit(f"post-sync revision mismatch: trinity="
                               f"{after.get('contentRevision')!r} feed={new_rev!r}")
          # Counts must match the feed we just published.
          feed = json.load(open("catalog/verified/feed.json"))
          exp_ep = sum(len(v) for v in feed["countries"].values())
          if (after.get("countryCount") != len(feed["countries"])
                  or after.get("endpointCount") != exp_ep):
              raise SystemExit(f"post-sync count mismatch: trinity="
                               f"{after.get('countryCount')}c/{after.get('endpointCount')}e "
                               f"feed={len(feed['countries'])}c/{exp_ep}e")
          print("post-sync verified: revision + counts match")
          EOF

      - name: Rebase onto latest main
        # A push landing between checkout and commit (e.g. the dispatch race of
        # 2026-09-23) must not kill the verified-feed commit step.
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The scan step just wrote the new feed into the worktree; stash it
          # around the rebase and restore so auto-commit still publishes it.
          git stash push -m "scan results" || true
          git pull --rebase origin main
          git stash pop || true

      - name: Commit verified results
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'scanner: verified catalog refresh [skip ci]'
          file_pattern: 'catalog/verified/** scanner/state.json'
