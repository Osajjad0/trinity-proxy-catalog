# Throwaway diagnostic: prints the DECODED CLAIMS (header + payload JSON) of
# this run's OIDC token so the panel verifier's expectations can be checked
# against GitHub's actual claim shapes. Never prints the token or signature.
name: oidc-claims-debug
on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and print claims
        shell: python
        run: |
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=trinity-catalog-sync"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) trinity-debug"})
          tok = json.load(urllib.request.urlopen(req, timeout=30))["value"]
          h, p, s = tok.split(".")
          pad = lambda seg: seg + "=" * (-len(seg) % 4)
          print("HEADER:", base64.urlsafe_b64decode(pad(h)).decode())
          print("PAYLOAD:", json.dumps(json.loads(base64.urlsafe_b64decode(pad(p))), indent=1))
          print("SIG_LEN_B64:", len(s))
