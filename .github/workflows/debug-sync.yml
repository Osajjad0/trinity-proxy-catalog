# Throwaway diagnostic: fetch this run's OIDC token and POST it to the Trinity
# test panel's sync endpoint, printing only the panel's JSON response body
# (which carries a rejection CLASS, never the token). The token itself is
# never printed.
name: oidc-sync-debug
on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: POST token, print panel verdict
        shell: python
        run: |
          import json, os, urllib.parse, urllib.request
          base = "https://trinity-fresh3.tmplbertohr.workers.dev/90418d70acf87f56"
          tok_url = (os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience="
                     + urllib.parse.quote("trinity-catalog-sync"))
          tok_req = urllib.request.Request(tok_url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          oidc = json.loads(urllib.request.urlopen(tok_req, timeout=30).read())["value"]
          req = urllib.request.Request(base + "/api/catalog-sync-github",
              data=b"{}", headers={"Authorization": "Bearer " + oidc,
              "Content-Type": "application/json",
              "User-Agent": "trinity-catalog-sync/1.0 (github-actions)"},
              method="POST")
          try:
              resp = urllib.request.urlopen(req, timeout=60)
              print("STATUS:", resp.status)
              print("BODY:", resp.read().decode()[:600])
          except urllib.error.HTTPError as e:
              print("STATUS:", e.code)
              print("BODY:", e.read().decode()[:600])
