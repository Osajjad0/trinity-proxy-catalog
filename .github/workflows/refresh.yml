name: Test and refresh catalog

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', 'tests/**', 'sources.json', '.github/workflows/refresh.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'sources.json', '.github/workflows/refresh.yml', 'catalog/**']

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified public tag API
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; verified public tag API
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_catalog.py --validate

  publish:
    if: github.repository == 'Osajjad0/trinity-proxy-catalog' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
          token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_catalog.py
      - run: python scripts/build_catalog.py --validate
      - name: Commit only validated catalog changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- catalog/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public candidate catalog'
          git push
